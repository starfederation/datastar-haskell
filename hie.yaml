cradle:
  cabal:
    - path: "src"
      component: "lib:datastar-hs"
    - path: "test"
      component: "datastar-hs:test:datastar-hs-test"
    - path: "e2e-server"
      component: "datastar-hs:exe:e2e-server"
    - path: "datastar-hs-zlib/src"
      component: "datastar-hs-zlib:lib:datastar-hs-zlib"
    - path: "datastar-hs-zlib/test"
      component: "datastar-hs-zlib:test:datastar-hs-zlib-test"
    - path: "datastar-hs-brotli/src"
      component: "datastar-hs-brotli:lib:datastar-hs-brotli"
    - path: "datastar-hs-brotli/test"
      component: "datastar-hs-brotli:test:datastar-hs-brotli-test"
    - path: "datastar-hs-zstd/src"
      component: "datastar-hs-zstd:lib:datastar-hs-zstd"
    - path: "datastar-hs-zstd/test"
      component: "datastar-hs-zstd:test:datastar-hs-zstd-test"
    - path: "examples/hello-world-warp.hs"
      component: "datastar-hs-examples:exe:hello-world-warp"
    - path: "examples/hello-world-servant.hs"
      component: "datastar-hs-examples:exe:hello-world-servant"
    - path: "examples/hello-world-channel.hs"
      component: "datastar-hs-examples:exe:hello-world-channel"
    - path: "examples/activity-feed.hs"
      component: "datastar-hs-examples:exe:activity-feed"
    - path: "examples/heap-view.hs"
