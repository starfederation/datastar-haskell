name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Core package, no compressors.
  core-no-system-libs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-core-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-cabal-core-${{ hashFiles('**/*.cabal') }}-
            ${{ runner.os }}-cabal-core-

      - name: Build
        run: cabal update && cabal build --project-file=cabal.project.core all

      - name: Run tests
        run: cabal test --project-file=cabal.project.core all

  # Full build: compressor add-on packages, examples, and benchmarks.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      - name: Install system libraries (brotli, zstd, zlib)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libbrotli-dev libzstd-dev zlib1g-dev

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal') }}-
            ${{ runner.os }}-cabal-

      - name: Install dependencies
        run: cabal update && cabal build all --only-dependencies

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.cabal') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: nix flake check
        run: nix flake check -L

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-core-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-cabal-core-${{ hashFiles('**/*.cabal') }}-
            ${{ runner.os }}-cabal-core-

      - name: Build e2e-server
        run: cabal update && cabal build --project-file=cabal.project.core e2e-server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
